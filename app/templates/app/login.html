
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MAILGUARD AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071426, #102d50);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #142943;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            color: #38bdf8;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b5c7dc;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #dce8f5;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #34516f;
            border-radius: 8px;
            background: #0b1d32;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0284c7;
        }

        .register-link {
            text-align: center;
            color: #b5c7dc;
            margin-top: 22px;
            font-size: 14px;
        }

        .register-link a {
            color: #38bdf8;
            text-decoration: none;
        }

        .error {
            color: #fca5a5;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🛡 MAILGUARD AI</div>

        <p class="subtitle">AI Powered Email Security System</p>

        <h2>Welcome Back!</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </p>

    </div>

</body>
</html>
