
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MAILGUARD AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071426, #102d50);
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            background: #142943;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            color: #38bdf8;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b5c7dc;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #dce8f5;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #34516f;
            border-radius: 8px;
            background: #0b1d32;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0284c7;
        }

        .login-link {
            text-align: center;
            color: #b5c7dc;
            margin-top: 22px;
            font-size: 14px;
        }

        .login-link a {
            color: #38bdf8;
            text-decoration: none;
        }

        .error {
            color: #fca5a5;
            margin-bottom: 15px;
            text-align: center;
        }

        .success {
            color: #86efac;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">🛡 MAILGUARD AI</div>

        <p class="subtitle">AI Powered Email Security System</p>

        <h2>Create Account</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="success">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <label>Full Name</label>
            <input type="text" name="full_name"
                   placeholder="Enter your full name" required>

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Choose a username" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm password" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</body>
</html>
